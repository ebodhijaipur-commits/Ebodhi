<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-label="DSA Placement Preparation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="rgba(255,255,255,0.35)"/>
    </pattern>
  </defs>
  <rect width="400" height="170" fill="url(#bg)"/>
  <rect width="400" height="170" fill="url(#dots)"/>
  <circle cx="352" cy="20" r="56" fill="rgba(255,255,255,0.12)"/>
  <circle cx="40" cy="160" r="44" fill="rgba(255,255,255,0.10)"/>
  <!-- binary tree -->
  <g stroke="#ffffff" stroke-width="4" fill="none" opacity="0.9">
    <path d="M200 46 L128 92 M200 46 L272 92 M128 92 L88 132 M128 92 L168 132 M272 92 L232 132 M272 92 L312 132"/>
  </g>
  <g font-family="monospace" font-weight="bold" text-anchor="middle">
    <circle cx="200" cy="42" r="19" fill="#ffffff"/>
    <text x="200" y="48" font-size="16" fill="#b91c1c">7</text>
    <circle cx="128" cy="94" r="17" fill="#fecaca"/>
    <text x="128" y="100" font-size="15" fill="#7f1d1d">3</text>
    <circle cx="272" cy="94" r="17" fill="#fecaca"/>
    <text x="272" y="100" font-size="15" fill="#7f1d1d">9</text>
    <circle cx="88" cy="134" r="14" fill="#ffffff" opacity="0.85"/>
    <text x="88" y="139" font-size="13" fill="#7f1d1d">1</text>
    <circle cx="168" cy="134" r="14" fill="#ffffff" opacity="0.85"/>
    <text x="168" y="139" font-size="13" fill="#7f1d1d">5</text>
    <circle cx="232" cy="134" r="14" fill="#ffffff" opacity="0.85"/>
    <text x="232" y="139" font-size="13" fill="#7f1d1d">8</text>
    <circle cx="312" cy="134" r="14" fill="#fde047"/>
    <text x="312" y="139" font-size="13" fill="#713f12">?</text>
  </g>
  <!-- timer chip -->
  <g transform="translate(84,52)">
    <rect x="-26" y="-14" width="52" height="28" rx="14" fill="#ffffff" opacity="0.94"/>
    <circle cx="-12" cy="0" r="6" fill="none" stroke="#b91c1c" stroke-width="2.6"/>
    <path d="M-12 -3 L-12 0 L-10 2" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <text x="8" y="5" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="13" fill="#7f1d1d">30m</text>
  </g>
