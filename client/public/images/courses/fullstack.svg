<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-label="Full-Stack Web Development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="rgba(255,255,255,0.35)"/>
    </pattern>
  </defs>
  <rect width="400" height="170" fill="url(#bg)"/>
  <rect width="400" height="170" fill="url(#dots)"/>
  <circle cx="44" cy="18" r="54" fill="rgba(255,255,255,0.10)"/>
  <!-- dual-monitor workstation -->
  <g transform="translate(200,96)">
    <rect x="-92" y="-52" width="86" height="58" rx="6" fill="#ffffff"/>
    <rect x="-84" y="-44" width="70" height="42" rx="3" fill="#dbeafe"/>
    <path d="M-72 -30 L-56 -30 M-72 -20 L-60 -20 M-72 -10 L-64 -10" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
    <text x="-30" y="-14" font-family="monospace" font-weight="bold" font-size="17" fill="#1e40af">&lt;/&gt;</text>
    <rect x="6" y="-52" width="86" height="58" rx="6" fill="#ffffff"/>
    <rect x="14" y="-44" width="70" height="42" rx="3" fill="#e0e7ff"/>
    <rect x="22" y="-36" width="54" height="10" rx="3" fill="#6366f1"/>
    <rect x="22" y="-20" width="38" height="8" rx="3" fill="#a5b4fc"/>
    <rect x="22" y="-8" width="46" height="8" rx="3" fill="#c7d2fe"/>
    <path d="M-49 6 L-49 18 M49 6 L49 18" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <rect x="-100" y="18" width="200" height="10" rx="5" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- keyboard -->
  <g transform="translate(200,146)">
    <rect x="-44" y="-7" width="88" height="14" rx="4" fill="#c7d2fe"/>
  </g>
  <g transform="translate(66,120)" font-family="monospace" font-weight="bold" font-size="19" fill="#ffffff" opacity="0.85">
    <text>API</text>
  </g>
  <g transform="translate(330,132)" font-family="monospace" font-weight="bold" font-size="19" fill="#ffffff" opacity="0.85">
    <text>DB</text>
  </g>
  <circle cx="340" cy="48" r="5" fill="rgba(255,255,255,0.75)"/>
</svg>
