<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-label="Generative AI for Working Professionals">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="rgba(255,255,255,0.35)"/>
    </pattern>
  </defs>
  <rect width="400" height="170" fill="url(#bg)"/>
  <rect width="400" height="170" fill="url(#dots)"/>
  <circle cx="46" cy="16" r="54" fill="rgba(255,255,255,0.12)"/>
  <circle cx="364" cy="162" r="46" fill="rgba(255,255,255,0.10)"/>
  <!-- professional at laptop, side view -->
  <ellipse cx="150" cy="156" rx="50" ry="7" fill="rgba(15,23,42,0.20)"/>
  <g transform="translate(150,104)">
    <path d="M-11 8 L-13 48" stroke="#1e293b" stroke-width="13" stroke-linecap="round"/>
    <path d="M13 8 L15 48" stroke="#1e293b" stroke-width="13" stroke-linecap="round"/>
    <path d="M-21 -36 h42 a9 9 0 0 1 9 9 v27 a9 9 0 0 1 -9 9 h-42 a9 9 0 0 1 -9 -9 v-27 a9 9 0 0 1 9 -9 z" fill="#0f172a"/>
    <path d="M-7 -36 L0 -26 L7 -36 Z" fill="#ffffff"/>
    <path d="M-26 -25 Q -38 -14 -44 2" stroke="#fcd9b8" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M26 -25 Q 40 -18 46 -6" stroke="#fcd9b8" stroke-width="11" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="-59" r="16.5" fill="#0c0a09"/>
    <circle cx="0" cy="-54" r="14" fill="#fcd9b8"/>
    <path d="M-14 -57 q14 -10 28 0 l-2 -7 q-12 -6 -24 0 z" fill="#0c0a09"/>
    <circle cx="-5" cy="-55" r="3.4" fill="none" stroke="#1e293b" stroke-width="1.8"/>
    <circle cx="5" cy="-55" r="3.4" fill="none" stroke="#1e293b" stroke-width="1.8"/>
    <path d="M-1.6 -55 L1.6 -55" stroke="#1e293b" stroke-width="1.8"/>
    <path d="M-4 -47 Q 0 -44 4 -47" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- laptop in front -->
  <g transform="translate(196,128)">
    <rect x="-20" y="-30" width="40" height="26" rx="3" fill="#1e293b"/>
    <rect x="-17" y="-27" width="34" height="20" rx="2" fill="#67e8f9"/>
    <path d="M-26 -4 L26 -4 L21 2 L-21 2 Z" fill="#334155"/>
  </g>
  <!-- generated content streaming out -->
  <g transform="translate(268,64)">
    <rect x="-34" y="-24" width="68" height="48" rx="8" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4338ca">Draft</text>
    <rect x="-24" y="2" width="48" height="6" rx="3" fill="#c7d2fe"/>
    <rect x="-24" y="12" width="34" height="6" rx="3" fill="#e0e7ff"/>
    <path d="M42 0 L58 0" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="1 7"/>
  </g>
  <!-- sparkles -->
  <g transform="translate(330,96)" fill="#fde047">
    <path d="M0 -12 L2.8 -3.7 L11.3 -3.7 L4.4 1.5 L6.9 9.9 L0 4.6 L-6.9 9.9 L-4.4 1.5 L-11.3 -3.7 L-2.8 -3.7 Z"/>
  </g>
  <g transform="translate(300,132)" font-family="monospace" font-weight="bold" font-size="17" fill="#ffffff" opacity="0.88">
    <text>prompt →</text>
