<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-label="Python for Data Science">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="rgba(255,255,255,0.35)"/>
    </pattern>
  </defs>
  <rect width="400" height="170" fill="url(#bg)"/>
  <rect width="400" height="170" fill="url(#dots)"/>
  <circle cx="48" cy="16" r="54" fill="rgba(255,255,255,0.12)"/>
  <circle cx="366" cy="162" r="46" fill="rgba(255,255,255,0.10)"/>
  <!-- open laptop with notebook code -->
  <g transform="translate(200,92)">
    <rect x="-78" y="-52" width="156" height="96" rx="10" fill="#ffffff"/>
    <rect x="-68" y="-42" width="136" height="76" rx="5" fill="#ecfdf5"/>
    <rect x="-58" y="-32" width="34" height="9" rx="4.5" fill="#16a34a"/>
    <rect x="-58" y="-16" width="60" height="8" rx="4" fill="#86efac"/>
    <rect x="-58" y="-2" width="44" height="8" rx="4" fill="#86efac"/>
    <!-- chart panel -->
    <rect x="14" y="-32" width="50" height="62" rx="5" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="20" y="8" width="9" height="14" rx="2" fill="#4ade80"/>
    <rect x="33" y="0" width="9" height="22" rx="2" fill="#22c55e"/>
    <rect x="46" y="-10" width="9" height="32" rx="2" fill="#16a34a"/>
    <path d="M18 -24 L30 -30 L44 -22 L56 -26" stroke="#059669" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>
  <!-- terminal chip -->
  <g transform="translate(88,132)">
    <rect x="-30" y="-15" width="60" height="30" rx="8" fill="#ffffff" opacity="0.94"/>
    <text x="0" y="6" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="15" fill="#166534">&gt;_</text>
  </g>
  <g transform="translate(322,52)" font-family="monospace" font-weight="bold" font-size="19" fill="#ffffff" opacity="0.9">
    <text>df</text>
  </g>
  <circle cx="330" cy="120" r="5" fill="rgba(255,255,255,0.75)"/>
</svg>
