<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-label="Marketing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="rgba(255,255,255,0.35)"/>
    </pattern>
  </defs>
  <rect width="400" height="170" fill="url(#bg)"/>
  <rect width="400" height="170" fill="url(#dots)"/>
  <circle cx="356" cy="16" r="60" fill="rgba(255,255,255,0.12)"/>
  <circle cx="40" cy="164" r="46" fill="rgba(255,255,255,0.10)"/>
  <ellipse cx="140" cy="156" rx="48" ry="7" fill="rgba(15,23,42,0.20)"/>
  <!-- marketer with megaphone -->
  <g transform="translate(140,104)">
    <path d="M-11 4 L-12 46" stroke="#831843" stroke-width="13" stroke-linecap="round"/>
    <path d="M13 4 L14 46" stroke="#831843" stroke-width="13" stroke-linecap="round"/>
    <path d="M-21 -38 h42 a9 9 0 0 1 9 9 v25 a9 9 0 0 1 -9 9 h-42 a9 9 0 0 1 -9 -9 v-25 a9 9 0 0 1 9 -9 z" fill="#ffffff"/>
    <path d="M-27 -27 Q -37 -12 -34 2" stroke="#fcd9b8" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M27 -27 Q 43 -32 49 -44" stroke="#fcd9b8" stroke-width="11" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="-61" r="17.5" fill="#4a044e"/>
    <circle cx="0" cy="-56" r="15" fill="#fcd9b8"/>
    <circle cx="-5.5" cy="-57" r="1.9" fill="#1e293b"/>
    <circle cx="5.5" cy="-57" r="1.9" fill="#1e293b"/>
    <path d="M-5 -50 Q 0 -45 6 -49" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- megaphone -->
  <g transform="translate(206,52) rotate(-18)">
    <path d="M-6 -14 L26 -26 L26 26 L-6 14 Z" fill="#ffffff"/>
    <rect x="-16" y="-10" width="12" height="20" rx="5" fill="#fde047"/>
    <path d="M34 -12 q10 12 0 24" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>
  <!-- likes floating -->
  <g transform="translate(300,58)">
