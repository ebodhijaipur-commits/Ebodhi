    <path d="M-5 2 l4 4 l7 -8" stroke="#ec4899" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <g transform="translate(330,116)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" opacity="0.92"/>
    <path d="M0 6 C -8 0 -6 -7 -1 -5 C 0 -4.6 0 -4.6 1 -5 C 6 -7 8 0 0 6 Z" fill="#ec4899"/>
  </g>
  <g transform="translate(258,132)" font-family="monospace" font-weight="bold" font-size="19" fill="#ffffff" opacity="0.9">
    <text>+128%</text>
  </g>
  <circle cx="86" cy="52" r="6" fill="rgba(255,255,255,0.85)"/>
</svg>
