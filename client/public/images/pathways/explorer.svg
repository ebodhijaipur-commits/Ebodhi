<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-label="AI Explorer, Grades 3-4">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="rgba(255,255,255,0.35)"/>
    </pattern>
  </defs>
  <rect width="400" height="170" fill="url(#bg)"/>
  <rect width="400" height="170" fill="url(#dots)"/>
  <circle cx="352" cy="16" r="58" fill="rgba(255,255,255,0.12)"/>
  <circle cx="36" cy="164" r="44" fill="rgba(255,255,255,0.10)"/>
  <!-- kid sitting cross-legged, playing with robot -->
  <ellipse cx="150" cy="152" rx="52" ry="8" fill="rgba(15,23,42,0.20)"/>
  <g transform="translate(150,104)">
    <!-- folded legs -->
    <path d="M-30 34 Q 0 46 30 34" stroke="#0e7490" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- body -->
    <path d="M-20 -26 h40 a8 8 0 0 1 8 8 v28 a8 8 0 0 1 -8 8 h-40 a8 8 0 0 1 -8 -8 v-28 a8 8 0 0 1 8 -8 z" fill="#ffffff"/>
    <!-- arms reaching forward to robot -->
    <path d="M-24 -14 Q -34 -2 -30 10" stroke="#fcd9b8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M24 -14 Q 36 -6 42 4" stroke="#fcd9b8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- head -->
    <circle cx="0" cy="-48" r="16.5" fill="#451a03"/>
    <circle cx="0" cy="-43" r="14" fill="#fcd9b8"/>
    <circle cx="-5" cy="-44" r="1.8" fill="#1e293b"/>
    <circle cx="5" cy="-44" r="1.8" fill="#1e293b"/>
    <path d="M-4.5 -37.5 Q 0 -34 4.5 -37.5" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- robot buddy facing the kid -->
  <g transform="translate(252,112)">
    <rect x="-20" y="-16" width="40" height="32" rx="10" fill="#ffffff"/>
    <circle cx="-7" cy="-1" r="3.2" fill="#0891b2"/>
    <circle cx="7" cy="-1" r="3.2" fill="#0891b2"/>
    <path d="M-5 8 Q 0 12 5 8" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M0 -16 L0 -24" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-27" r="4" fill="#fde047"/>
  </g>
  <!-- stacked blocks in front -->
  <g transform="translate(196,146)">
    <rect x="-34" y="-12" width="20" height="20" rx="4" fill="#fde047"/>
    <rect x="-11" y="-12" width="20" height="20" rx="4" fill="#ffffff" opacity="0.92"/>
    <text x="-24" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#a16207">A</text>
    <text x="-1" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#0891b2">B</text>
  </g>
  <g transform="translate(330,60)" fill="#ffffff" opacity="0.9">
    <path d="M0 -11 L2.6 -3.4 L10.6 -3.4 L4.2 1.4 L6.6 9 L0 4.2 L-6.6 9 L-4.2 1.4 L-10.6 -3.4 L-2.6 -3.4 Z"/>
  </g>
</svg>
