<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-label="AI Learner, Grades 5-6">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="rgba(255,255,255,0.35)"/>
    </pattern>
  </defs>
  <rect width="400" height="170" fill="url(#bg)"/>
  <rect width="400" height="170" fill="url(#dots)"/>
  <circle cx="350" cy="18" r="58" fill="rgba(255,255,255,0.12)"/>
  <circle cx="38" cy="162" r="44" fill="rgba(255,255,255,0.10)"/>
  <ellipse cx="146" cy="158" rx="46" ry="7" fill="rgba(15,23,42,0.20)"/>
  <!-- curious kid with magnifier -->
  <g transform="translate(146,108)">
    <path d="M-10 4 L-11 44" stroke="#115e59" stroke-width="12" stroke-linecap="round"/>
    <path d="M12 4 L13 44" stroke="#115e59" stroke-width="12" stroke-linecap="round"/>
    <path d="M-20 -36 h40 a8 8 0 0 1 8 8 v26 a8 8 0 0 1 -8 8 h-40 a8 8 0 0 1 -8 -8 v-26 a8 8 0 0 1 8 -8 z" fill="#ffffff"/>
    <path d="M-26 -26 Q -35 -12 -32 2" stroke="#fcd9b8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M26 -26 Q 42 -30 48 -42" stroke="#fcd9b8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="-58" r="16.5" fill="#1c1917"/>
    <circle cx="0" cy="-53" r="14" fill="#fcd9b8"/>
    <circle cx="-5" cy="-54" r="1.8" fill="#1e293b"/>
    <circle cx="5" cy="-54" r="1.8" fill="#1e293b"/>
    <path d="M-4.5 -47.5 Q 0 -44 4.5 -47.5" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- magnifying glass over data -->
  <g transform="translate(236,96)" stroke="#ffffff" fill="none">
    <circle cx="0" cy="0" r="17" stroke-width="6"/>
    <path d="M13 13 L28 28" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- data blocks -->
  <g transform="translate(314,124)">
    <rect x="-38" y="-10" width="20" height="38" rx="4" fill="#ffffff" opacity="0.75"/>
    <rect x="-11" y="-22" width="20" height="50" rx="4" fill="#ffffff" opacity="0.88"/>
    <rect x="16" y="-34" width="20" height="62" rx="4" fill="#ffffff"/>
    <text x="-28" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#0f766e">A</text>
    <text x="-1" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#0f766e">B</text>
    <text x="26" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#0f766e">C</text>
  </g>
  <!-- question spark -->
  <g transform="translate(84,52)" font-family="Arial, sans-serif" font-weight="bold" font-size="30" fill="#ffffff" opacity="0.92">
    <text>?</text>
  </g>
