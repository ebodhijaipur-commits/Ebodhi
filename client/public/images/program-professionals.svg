<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-label="IT professional presenting with rising chart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="rgba(255,255,255,0.35)"/>
    </pattern>
  </defs>
  <rect width="400" height="170" fill="url(#bg)"/>
  <rect width="400" height="170" fill="url(#dots)"/>
  <circle cx="360" cy="20" r="65" fill="rgba(255,255,255,0.12)"/>
  <circle cx="35" cy="160" r="50" fill="rgba(255,255,255,0.10)"/>

  <ellipse cx="136" cy="159" rx="52" ry="7" fill="rgba(15,23,42,0.20)"/>

  <!-- professional character -->
  <g transform="translate(136,106)">
    <!-- legs -->
    <path d="M-11 4 L-12 46" stroke="#1e293b" stroke-width="13" stroke-linecap="round"/>
    <path d="M13 4 L14 46" stroke="#1e293b" stroke-width="13" stroke-linecap="round"/>
    <!-- blazer body -->
    <path d="M-23 -38 h46 a9 9 0 0 1 9 9 v25 a9 9 0 0 1 -9 9 h-46 a9 9 0 0 1 -9 -9 v-25 a9 9 0 0 1 9 -9 z" fill="#0f172a"/>
    <!-- shirt + tie -->
    <path d="M-8 -38 L0 -26 L8 -38 Z" fill="#ffffff"/>
    <path d="M0 -26 L4 -18 L0 -2 L-4 -18 Z" fill="#fb7185"/>
    <!-- left arm down -->
    <path d="M-29 -27 Q -39 -12 -36 2" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- right arm raised presenting -->
    <path d="M29 -27 Q 45 -36 49 -54" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="50" cy="-57" r="6" fill="#fcd9b8"/>
    <!-- head -->
    <circle cx="0" cy="-58" r="15.5" fill="#fcd9b8"/>
    <path d="M-15.5 -60 a15.5 15.5 0 0 1 31 0 l-3 -2 q-12.5 -6 -25 0 z" fill="#1c1917"/>
    <!-- glasses -->
    <circle cx="-5.5" cy="-59" r="3.6" fill="none" stroke="#1e293b" stroke-width="1.8"/>
    <circle cx="5.5" cy="-59" r="3.6" fill="none" stroke="#1e293b" stroke-width="1.8"/>
    <path d="M-1.9 -59 L1.9 -59" stroke="#1e293b" stroke-width="1.8"/>
    <path d="M-4 -51 Q 0 -48 4 -51" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- rising bar chart -->
  <g transform="translate(286,110)">
    <rect x="-30" y="-6" width="16" height="34" rx="4" fill="#ffffff" opacity="0.75"/>
    <rect x="-8" y="-18" width="16" height="46" rx="4" fill="#ffffff" opacity="0.88"/>
    <rect x="14" y="-32" width="16" height="60" rx="4" fill="#ffffff"/>
    <path d="M-24 -14 L0 -28 L10 -24 L26 -44" stroke="#fde047" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M26 -44 L18 -44 M26 -44 L26 -36" stroke="#fde047" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- AI chip -->
  <g transform="translate(320,48)">
    <rect x="-19" y="-19" width="38" height="38" rx="9" fill="#ffffff"/>
    <text x="0" y="7" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="17" fill="#ec4899">AI</text>
    <path d="M-26 -8 L-33 -8 M-26 8 L-33 8 M26 -8 L33 -8 M26 8 L33 8 M-8 -26 L-8 -33 M8 -26 L8 -33 M-8 26 L-8 33 M8 26 L8 33" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
  </g>

  <g transform="translate(84,58)" font-family="monospace" font-weight="bold" font-size="22" fill="#ffffff" opacity="0.9">
    <text>λ()</text>
  </g>
  <circle cx="240" cy="40" r="5" fill="rgba(255,255,255,0.75)"/>
</svg>
