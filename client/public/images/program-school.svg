<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-label="School student with robot buddy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="rgba(255,255,255,0.35)"/>
    </pattern>
  </defs>
  <rect width="400" height="170" fill="url(#bg)"/>
  <rect width="400" height="170" fill="url(#dots)"/>
  <circle cx="350" cy="15" r="70" fill="rgba(255,255,255,0.12)"/>
  <circle cx="35" cy="165" r="50" fill="rgba(255,255,255,0.10)"/>

  <ellipse cx="132" cy="159" rx="48" ry="7" fill="rgba(15,23,42,0.20)"/>

  <!-- kid character -->
  <g transform="translate(132,106)">
    <!-- backpack -->
    <rect x="-36" y="-32" width="19" height="44" rx="9" fill="#f59e0b"/>
    <!-- legs -->
    <path d="M-10 4 L-11 46" stroke="#134e4a" stroke-width="13" stroke-linecap="round"/>
    <path d="M12 4 L13 46" stroke="#134e4a" stroke-width="13" stroke-linecap="round"/>
    <!-- t-shirt body -->
    <path d="M-21 -38 h42 a9 9 0 0 1 9 9 v25 a9 9 0 0 1 -9 9 h-42 a9 9 0 0 1 -9 -9 v-25 a9 9 0 0 1 9 -9 z" fill="#ffffff"/>
    <!-- arms -->
    <path d="M-27 -27 Q -37 -12 -34 2" stroke="#fcd9b8" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M27 -27 Q 43 -34 47 -53" stroke="#fcd9b8" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- head -->
    <circle cx="0" cy="-61" r="17.5" fill="#451a03"/>
    <circle cx="0" cy="-56" r="15" fill="#fcd9b8"/>
    <circle cx="-5.5" cy="-57" r="1.9" fill="#1e293b"/>
    <circle cx="5.5" cy="-57" r="1.9" fill="#1e293b"/>
    <path d="M-5 -50 Q 0 -46 5 -50" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- robot buddy -->
  <g transform="translate(252,74)">
    <path d="M0 -22 L0 -30" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-33" r="4" fill="#fde047"/>
    <rect x="-21" y="-22" width="42" height="34" rx="10" fill="#ffffff"/>
    <circle cx="-8" cy="-6" r="3.4" fill="#0ea5e9"/>
    <circle cx="8" cy="-6" r="3.4" fill="#0ea5e9"/>
    <path d="M-6 3 Q 0 8 6 3" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>

  <g transform="translate(318,118)" font-family="monospace" font-weight="bold" font-size="24" fill="#ffffff" opacity="0.92">
    <text>&lt;/&gt;</text>
  </g>
  <g transform="translate(84,44)" fill="#ffffff" opacity="0.9">
    <path d="M0 -11 L2.6 -3.4 L10.6 -3.4 L4.2 1.4 L6.6 9 L0 4.2 L-6.6 9 L-4.2 1.4 L-10.6 -3.4 L-2.6 -3.4 Z"/>
  </g>
  <circle cx="330" cy="42" r="5" fill="rgba(255,255,255,0.75)"/>
</svg>
