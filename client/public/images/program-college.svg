<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-label="College graduate holding a laptop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0056d2"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="rgba(255,255,255,0.35)"/>
    </pattern>
  </defs>
  <rect width="400" height="170" fill="url(#bg)"/>
  <rect width="400" height="170" fill="url(#dots)"/>
  <circle cx="45" cy="10" r="65" fill="rgba(255,255,255,0.12)"/>
  <circle cx="370" cy="165" r="55" fill="rgba(255,255,255,0.10)"/>

  <ellipse cx="140" cy="159" rx="50" ry="7" fill="rgba(15,23,42,0.20)"/>

  <!-- graduate character -->
  <g transform="translate(140,106)">
    <!-- legs -->
    <path d="M-11 4 L-12 46" stroke="#1e1b4b" stroke-width="13" stroke-linecap="round"/>
    <path d="M13 4 L14 46" stroke="#1e1b4b" stroke-width="13" stroke-linecap="round"/>
    <!-- hoodie body -->
    <path d="M-22 -38 h44 a9 9 0 0 1 9 9 v25 a9 9 0 0 1 -9 9 h-44 a9 9 0 0 1 -9 -9 v-25 a9 9 0 0 1 9 -9 z" fill="#eef2ff"/>
    <!-- left arm down -->
    <path d="M-28 -27 Q -38 -12 -35 2" stroke="#eef2ff" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- right arm holding laptop -->
    <path d="M28 -27 Q 44 -20 46 -4" stroke="#eef2ff" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- laptop -->
    <g transform="translate(52,-8) rotate(-8)">
      <rect x="-16" y="-22" width="32" height="22" rx="3" fill="#1e293b"/>
      <rect x="-13" y="-19" width="26" height="16" rx="2" fill="#67e8f9"/>
      <path d="M-20 0 L20 0 L16 5 L-16 5 Z" fill="#1e293b"/>
    </g>
    <!-- head -->
    <circle cx="0" cy="-58" r="15.5" fill="#fcd9b8"/>
    <path d="M-15.5 -60 a15.5 15.5 0 0 1 31 0 l-3 -1 q-12.5 -7 -25 0 z" fill="#1c1917"/>
    <circle cx="-5.5" cy="-59" r="1.9" fill="#1e293b"/>
    <circle cx="5.5" cy="-59" r="1.9" fill="#1e293b"/>
    <path d="M-5 -52 Q 0 -48 5 -52" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- mortarboard -->
    <path d="M0 -84 L34 -74 L0 -64 L-34 -74 Z" fill="#1e293b"/>
    <path d="M-13 -70 L-13 -61 C -13 -56 13 -56 13 -61 L 13 -70 L 0 -66 Z" fill="#334155"/>
    <path d="M30 -73 L30 -58" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="30" cy="-56" r="3.6" fill="#fbbf24"/>
  </g>

  <!-- floating code + gear -->
  <g transform="translate(300,54)" font-family="monospace" font-weight="bold" font-size="26" fill="#ffffff" opacity="0.92">
    <text>{ }</text>
  </g>
  <g transform="translate(282,124)" stroke="#ffffff" opacity="0.92" fill="none">
    <circle cx="0" cy="0" r="11" stroke-width="4"/>
    <path d="M0 -17 L0 -12 M0 17 L0 12 M-17 0 L-12 0 M17 0 L12 0 M-12 -12 L-8.5 -8.5 M12 12 L8.5 8.5 M12 -12 L8.5 -8.5 M-12 12 L-8.5 8.5" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(88,52)" font-family="monospace" font-weight="bold" font-size="22" fill="#ffffff" opacity="0.9">
    <text>&lt;/&gt;</text>
  </g>
  <circle cx="340" cy="96" r="5" fill="rgba(255,255,255,0.75)"/>
</svg>
